<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>snip — URL Shortener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #7c6af7;
      --accent-dim: #3d3580;
      --accent-glow: rgba(124, 106, 247, 0.2);
      --text: #e8e8f0;
      --muted: #6b6b80;
      --success: #4ade80;
      --error: #f87171;
      --font-display: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1.5rem;
      overflow-x: hidden;
    }

    /* Radial glow bg */
    body::before {
      content: '';
      position: fixed;
      top: -20vh;
      left: 50%;
      transform: translateX(-50%);
      width: 80vw;
      height: 60vh;
      background: radial-gradient(ellipse, rgba(124,106,247,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    nav {
      width: 100%;
      max-width: 760px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2rem 0 0;
      position: relative;
      z-index: 1;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
      text-decoration: none;
    }

    .logo span { color: var(--accent); }

    main {
      width: 100%;
      max-width: 760px;
      margin-top: 8vh;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      margin-bottom: 1.2rem;
    }

    h1 em {
      font-style: normal;
      color: var(--accent);
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.1rem;
      font-weight: 400;
      margin-bottom: 3rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    input[type="url"], input[type="text"] {
      flex: 1;
      min-width: 200px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 0.85rem 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    input::placeholder { color: var(--muted); }

    .btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.85rem 1.6rem;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
      letter-spacing: 0.01em;
    }

    .btn:hover { opacity: 0.88; box-shadow: 0 0 20px var(--accent-glow); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .options-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex: 1;
      min-width: 160px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.875rem;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus { border-color: var(--accent); }

    /* Result card */
    .result {
      background: rgba(124,106,247,0.06);
      border: 1px solid var(--accent-dim);
      border-radius: 16px;
      padding: 1.5rem;
      display: none;
      animation: fadeUp 0.3s ease;
    }

    .result.visible { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 0.6rem;
    }

    .result-url {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text);
      word-break: break-all;
      margin-bottom: 1rem;
    }

    .result-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      transition: border-color 0.2s, color 0.2s;
      letter-spacing: 0.03em;
    }

    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    .copy-flash {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--success);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .copy-flash.show { opacity: 1; }

    .error-msg {
      color: var(--error);
      font-size: 0.875rem;
      margin-top: 0.75rem;
      font-family: var(--font-mono);
      display: none;
    }

    .error-msg.visible { display: block; }

    footer {
      width: 100%;
      max-width: 760px;
      text-align: center;
      padding: 4rem 0 2.5rem;
      color: var(--muted);
      font-size: 0.8rem;
      position: relative;
      z-index: 1;
    }

    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>

<nav>
  <a href="/" class="logo">sn<span>i</span>p</a>
</nav>

<main>
  <h1>Short links,<br /><em>big impact.</em></h1>
  <p class="subtitle">Paste a URL. Get a clean, trackable link in seconds.</p>

  <div class="card">
    <div class="input-row">
      <input type="url" id="urlInput" placeholder="https://your-long-url.com/goes/here" autocomplete="off" />
      <button class="btn" id="shortenBtn">Shorten →</button>
    </div>

    <div class="options-row">
      <div class="field-group">
        <label for="customSlug">Custom alias (optional)</label>
        <input type="text" id="customSlug" placeholder="my-link" maxlength="20" />
      </div>
      <div class="field-group">
        <label for="expiry">Expires after</label>
        <select id="expiry">
          <option value="7">7 days</option>
          <option value="30" selected>30 days</option>
          <option value="90">90 days</option>
          <option value="365">1 year</option>
        </select>
      </div>
    </div>

    <p class="error-msg" id="errorMsg"></p>
  </div>

  <div class="result" id="result">
    <p class="result-label">Your short link</p>
    <p class="result-url" id="resultUrl"></p>
    <div class="result-actions">
      <button class="btn" id="copyBtn">Copy link</button>
      <button class="btn-outline" id="openBtn">Open ↗</button>
      <span class="copy-flash" id="copyFlash">Copied!</span>
    </div>
  </div>
</main>

<footer>
  Built with Node.js · TypeScript · PostgreSQL &nbsp;·&nbsp;
  <a href="https://github.com/reuben-claassen/url-shortener" target="_blank">View source on GitHub ↗</a>
</footer>

<script>
  const urlInput   = document.getElementById('urlInput');
  const customSlug = document.getElementById('customSlug');
  const expiry     = document.getElementById('expiry');
  const shortenBtn = document.getElementById('shortenBtn');
  const result     = document.getElementById('result');
  const resultUrl  = document.getElementById('resultUrl');
  const copyBtn    = document.getElementById('copyBtn');
  const openBtn    = document.getElementById('openBtn');
  const copyFlash  = document.getElementById('copyFlash');
  const errorMsg   = document.getElementById('errorMsg');

  let currentShortUrl = '';

  const showError = (msg) => {
    errorMsg.textContent = msg;
    errorMsg.classList.add('visible');
    result.classList.remove('visible');
  };

  const clearError = () => errorMsg.classList.remove('visible');

  shortenBtn.addEventListener('click', async () => {
    clearError();
    const url = urlInput.value.trim();

    if (!url) { showError('Please enter a URL'); return; }

    try { new URL(url); } catch {
      showError('Please enter a valid URL (including https://)');
      return;
    }

    shortenBtn.disabled = true;
    shortenBtn.textContent = 'Shortening…';

    try {
      const body = {
        url,
        expiresInDays: parseInt(expiry.value, 10),
        ...(customSlug.value.trim() && { customSlug: customSlug.value.trim() }),
      };

      const res = await fetch('/api/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      const data = await res.json();

      if (!data.success) {
        showError(data.error ?? 'Something went wrong');
        return;
      }

      currentShortUrl = data.data.shortUrl;
      resultUrl.textContent = currentShortUrl;
      result.classList.add('visible');
      urlInput.value = '';
      customSlug.value = '';
    } catch {
      showError('Network error — is the server running?');
    } finally {
      shortenBtn.disabled = false;
      shortenBtn.textContent = 'Shorten →';
    }
  });

  urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') shortenBtn.click();
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(currentShortUrl);
      copyFlash.classList.add('show');
      setTimeout(() => copyFlash.classList.remove('show'), 2000);
    } catch {
      copyFlash.textContent = 'Copy failed';
      copyFlash.classList.add('show');
      setTimeout(() => { copyFlash.classList.remove('show'); copyFlash.textContent = 'Copied!'; }, 2000);
    }
  });

  openBtn.addEventListener('click', () => {
    if (currentShortUrl) window.open(currentShortUrl, '_blank');
  });
</script>
</body>
</html>
